  <text x="544" y="286" font-family="Fira Code, Courier New, monospace" font-size="13" fill="#A1A1AA">PULL REQUESTS <tspan fill="#F3F4F6" font-weight="800">1</tspan></text>
  <text x="744" y="286" font-family="Fira Code, Courier New, monospace" font-size="13" fill="#A1A1AA">ISSUES <tspan fill="#F3F4F6" font-weight="800">0</tspan></text>
  <text x="874" y="286" font-family="Fira Code, Courier New, monospace" font-size="13" fill="#A1A1AA">REVIEWS <tspan fill="#F3F4F6" font-weight="800">0</tspan></text>

