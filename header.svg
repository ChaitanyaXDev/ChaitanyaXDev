<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070707"/>
      <stop offset="0.5" stop-color="#0D0A0A"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 145) rotate(90) scale(115 430)">
      <stop stop-color="#DC2626" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" stroke="#262626" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- subtle glow line -->
  <rect x="20" y="20" width="1160" height="260" rx="14" stroke="#EF4444" stroke-opacity="0.25" stroke-width="8" filter="url(#blur)"/>
  <rect x="20" y="20" width="1160" height="260" rx="14" stroke="#EF4444" stroke-width="2"/>

  <!-- corner brackets -->
  <path d="M38 78V38H78" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M1122 38H1162V78" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 222V262H78" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M1122 262H1162V222" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>

  <!-- status pill -->
  <rect x="470" y="43" width="260" height="34" rx="17" fill="#111111" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="492" cy="60" r="5" fill="#EF4444"/>
  <text x="505" y="66" fill="#F87171"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" letter-spacing="2.4">
    BUILDING REAL-WORLD SOFTWARE
  </text>

  <!-- name -->
  <text x="600" y="145" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48" font-weight="800" letter-spacing="4"
        filter="url(#textGlow)">
    CHAITANYA DEVENDRA WARGHAT
  </text>

  <!-- descriptor -->
  <text x="600" y="185" text-anchor="middle"
        fill="#EF4444"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700" letter-spacing="3.2">
    COMPUTER SCIENCE &amp; DESIGN  •  JAVA  •  FULL STACK  •  AI/ML
  </text>

  <!-- divider diamond -->
  <path d="M600 204 L610 214 L600 224 L590 214 Z" fill="#EF4444"/>
  <path d="M600 208 L606 214 L600 220 L594 214 Z" fill="#F87171"/>

  <!-- footer line -->
  <text x="600" y="255" text-anchor="middle"
        fill="#A1A1AA"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="600" letter-spacing="2.8">
    &lt;/&gt; TURNING IDEAS INTO PRACTICAL SOFTWARE
  </text>
</svg>
